worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 21m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8612; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:" always;

    location = /nginx-health { return 200 "ok"; }

    location ~ ^/(v1|healthz|readyz)(/|$) {
      set $api http://api:8610;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    # same-origin OIDC token exchange (dev-oidc); the authorize page itself is a top-level navigation
    location /oidc/ {
      set $oidc http://dev-oidc:8612;
      rewrite ^/oidc/(.*)$ /$1 break;
      proxy_pass $oidc;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:8612;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
