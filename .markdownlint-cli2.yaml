# Run from web/ (pnpm -C web exec markdownlint-cli2 --config ../.markdownlint-cli2.yaml)
config:
  default: true
  MD013: false
  MD024: { siblings_only: true }
  MD033: { allowed_elements: [img, br, details, summary, kbd, picture, source, p, a] }
  MD041: false
  MD060: false
globs:
  - "../**/*.md"
ignores:
  - "../**/node_modules/**"
  - "../web/playwright-report/**"
  - "../.venv/**"
  - "../.claude/**"
  - "../third_party/**/node_modules/**"
