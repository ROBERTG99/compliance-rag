# Route → model setting, effort and limits. Applied by llm/gateway.py.
routes:
  condense_followup:
    model_setting: model_fast        # CRAG_MODEL_FAST, default claude-haiku-5-5
    effort: low
    max_tokens: 2000
    timeout_s: 10
  generate:
    model_setting: model_generate    # CRAG_MODEL_GENERATE, default claude-opus-5-5
    effort: medium
    max_tokens: 16000
    timeout_s: 30
  judge:
    model_setting: model_judge       # CRAG_MODEL_JUDGE, default claude-haiku-5-5
    effort: low
    max_tokens: 2000
    timeout_s: 20
# USD per million tokens (input, output, cache read, cache write). Anthropic first-party list prices.
pricing:
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
