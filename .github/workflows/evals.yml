# Offline evals with gates and the red-team; the report is posted on the PR (BUILD.md §11, §17).
name: evals
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/redteam/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --frozen
          pnpm -C evals/redteam install --frozen-lockfile
      - name: Build the MinIO image (compiled from a pinned release; the one first-build step outside NFR-7)
        run: docker compose build minio
      - name: Runner CPU (the offline numbers depend on the floating-point code paths it selects)
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 -ow avx512f /proc/cpuinfo || echo "no avx512f"
      - name: Start the stack
        run: make up
      - name: Offline evals (fail on any gate or baseline regression)
        run: make eval
      - name: Per-case eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs
          path: evals/reports/runs/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Red-team (Promptfoo)
        run: make redteam
      - name: Comment the report on the PR
        # fork PRs get a read-only token
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("evals/REPORT.md", "utf8");
            const marker = "<!-- crag-evals -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            const text = `${marker}\n${body}`.slice(0, 65000);
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
      # diagnostics last, so the end of the job log shows them
      - name: Cases below full recall or reciprocal rank (compare runs across runners)
        if: always()
        run: |
          grep -m1 'model name' /proc/cpuinfo
          python3 - <<'PY'
          import json
          for suite in ("rag", "retrieval"):
              cases = json.load(open(f"evals/reports/runs/{suite}.json"))["cases"]
              low = [
                  (c["id"], c["scores"].get("recall@10"), c["scores"].get("mrr@10"))
                  for c in cases
                  if any(isinstance(c["scores"].get(m), float) and c["scores"][m] < 1 for m in ("recall@10", "mrr@10"))
              ]
              print(suite, low)
          PY
      - name: Vector leg against exact search (HNSW graphs are built on this runner)
        if: always()
        env:
          OPENBLAS_CORETYPE: Haswell
        run: uv run python scripts/vector_recall.py
