# Tag v*: build the images and push them to GHCR (BUILD.md §17). No deploys.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          docker compose build api dev-oidc web minio
          for image in api dev-oidc web; do
            docker tag "compliance-rag/${image}:dev" "ghcr.io/${owner}/compliance-rag-${image}:${TAG}"
            docker push "ghcr.io/${owner}/compliance-rag-${image}:${TAG}"
          done
