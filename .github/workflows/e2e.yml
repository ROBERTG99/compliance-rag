# The compose stack, seed and Playwright with axe against it.
name: e2e
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --frozen
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      - name: Build the MinIO image (compiled from a pinned release; the one first-build step outside the 5-minute `make up` budget)
        run: docker compose build minio
      - name: Start the stack (healthchecks, seed) within 5 minutes
        run: make up
      - name: Demo scenario
        run: make demo
      - name: Playwright + axe
        run: make e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            compose-logs.txt
