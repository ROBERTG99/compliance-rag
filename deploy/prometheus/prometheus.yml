# Prometheus (compose profile `observability`, host port 8691): scrapes the API and the worker.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8610"]
  - job_name: worker
    static_configs:
      - targets: ["worker:8611"]
