name: compliance-rag

x-build-args: &build-args
  HTTPS_PROXY: "${HTTPS_PROXY:-}"

x-app-env: &app-env
  DEMO_MODE: "${DEMO_MODE:-offline}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  CRAG_DATABASE_URL: postgresql://crag:crag@postgres:5432/crag
  CRAG_REDIS_URL: redis://redis:6379/0
  CRAG_OPENSEARCH_URL: http://opensearch:9200
  CRAG_S3_ENDPOINT_URL: http://minio:9000
  CRAG_S3_ACCESS_KEY: crag-dev-access
  CRAG_S3_SECRET_KEY: crag-dev-secret-key
  CRAG_S3_BUCKET: crag-raw
  CRAG_QDRANT_URL: http://qdrant:6333
  CRAG_OIDC_ISSUER: http://dev-oidc:8612
  CRAG_OIDC_PUBLIC_ISSUER: http://localhost:8612
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"  # profile observability: http://otel-collector:4318
  # profile langfuse: LANGFUSE_HOST=http://langfuse:3000 with the profile's dev project keys (compose below)
  LANGFUSE_HOST: "${LANGFUSE_HOST:-}"
  LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
  LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: crag
      POSTGRES_PASSWORD: crag
      POSTGRES_DB: crag
    ports: ["127.0.0.1:8620:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crag -d crag"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports: ["127.0.0.1:8630:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: ["qdrant"]
    ports: ["127.0.0.1:8643:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
      # dev stack: the disk allowance can look "full" to OpenSearch on shared hosts (DECISIONS.md)
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports: ["127.0.0.1:8640:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      network: host
      args: *build-args
    image: compliance-rag/minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: crag-dev-access
      MINIO_ROOT_PASSWORD: crag-dev-secret-key
    ports: ["127.0.0.1:8641:9000", "127.0.0.1:8642:9001"]
    volumes: [miniodata:/data]

  dev-oidc:
    build:
      context: .
      dockerfile: docker/dev-oidc.Dockerfile
      network: host
      args: *build-args
    image: compliance-rag/dev-oidc:dev
    environment:
      DEV_OIDC_PUBLIC_URL: http://localhost:8612
    ports: ["127.0.0.1:8612:8612"]

  migrate:
    image: compliance-rag/api:dev
    command: ["crag", "migrate"]
    environment: *app-env
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    image: compliance-rag/api:dev
    command: ["crag", "seed", "--no-migrate"]
    environment: *app-env
    restart: "no"
    depends_on:
      migrate: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      network: host
      args: *build-args
    image: compliance-rag/api:dev
    environment:
      <<: *app-env
      # uvicorn worker processes: CPU-bound steps of concurrent runs (embedding, rerank, guards) use more
      # than one core; runs, event streams and the rate limiter are shared through Redis
      WEB_CONCURRENCY: "${API_WORKERS:-3}"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus  # /metrics sums every worker process
    tmpfs: ["/tmp/prometheus"]
    ports: ["127.0.0.1:8610:8610"]
    # GET /v1/evals/latest serves what `make eval` last wrote (the image carries the committed copy)
    volumes: ["./evals/reports:/app/evals/reports:ro"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      dev-oidc: { condition: service_healthy }

  worker:
    image: compliance-rag/api:dev
    command: ["arq", "compliance_rag.worker.main.WorkerSettings"]
    environment: *app-env
    ports: ["127.0.0.1:8611:8611"]
    healthcheck:
      test: ["CMD", "arq", "--check", "compliance_rag.worker.main.WorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      network: host
      args:
        <<: *build-args
        VITE_DEV_PERSONAS: "1"  # local dev stack only: dev-oidc persona switcher
    image: compliance-rag/web:dev
    ports: ["127.0.0.1:8600:8080"]
    depends_on:
      api: { condition: service_healthy }

  # --- profile observability (BUILD.md §14): collector 8680/8681, Grafana 8690, Prometheus 8691, Jaeger 8692
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes: ["./deploy/otel/collector.yaml:/etc/otelcol/collector.yaml:ro"]
    ports: ["127.0.0.1:8680:4317", "127.0.0.1:8681:4318"]
    depends_on: [jaeger]  # distroless images (collector, Jaeger) have no shell for a healthcheck

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: ["observability"]
    ports: ["127.0.0.1:8692:16686"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:8691:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:8690:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- profile live: the same API with a real model (DEMO_MODE=live), on 8614 next to the offline one
  api-live:
    image: compliance-rag/api:dev
    profiles: ["live"]
    environment:
      <<: *app-env
      DEMO_MODE: live
      CRAG_LLM_PROVIDER: "${CRAG_LLM_PROVIDER:-anthropic}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LIVE_EVAL_BUDGET_USD: "${LIVE_EVAL_BUDGET_USD:-2}"
      WEB_CONCURRENCY: "${API_WORKERS:-3}"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs: ["/tmp/prometheus"]
    ports: ["127.0.0.1:8614:8610"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      dev-oidc: { condition: service_healthy }

  # --- profile langfuse (8693): LLM call observability; the app reports generations when LANGFUSE_* are set
  langfuse-db:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    profiles: ["langfuse"]
    environment:
      PGPASSWORD: crag
    command: ["sh", "-c", "psql -h postgres -U crag -d crag -tc \"SELECT 1 FROM pg_database WHERE datname = 'langfuse'\" | grep -q 1 || psql -h postgres -U crag -d crag -c 'CREATE DATABASE langfuse'"]
    depends_on:
      postgres: { condition: service_healthy }

  langfuse:
    image: langfuse/langfuse:2.95.11@sha256:85c278dcab96c15db94191a5c1664f85aba2d7fb6771a00e99681c902c4b7015
    profiles: ["langfuse"]
    environment:
      DATABASE_URL: postgresql://crag:crag@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:8693
      NEXTAUTH_SECRET: dev-only-langfuse-nextauth  # local profile only; not a secret
      SALT: dev-only-langfuse-salt
      TELEMETRY_ENABLED: "false"
      HOSTNAME: 0.0.0.0  # Next.js listens on the container IP only otherwise (healthcheck uses 127.0.0.1)
      LANGFUSE_INIT_ORG_ID: northwind
      LANGFUSE_INIT_PROJECT_ID: compliance-rag
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-dev-northwind
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-dev-northwind  # dev-only placeholder key for the local profile
      LANGFUSE_INIT_USER_EMAIL: admin@northwind.test
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: dev-only-password
    ports: ["127.0.0.1:8693:3000"]
    depends_on:
      langfuse-db: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  pgdata:
  osdata:
  miniodata:
  qdrantdata:
