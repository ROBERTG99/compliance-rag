name: compliance-rag

x-build-args: &build-args
  HTTPS_PROXY: "${HTTPS_PROXY:-}"

x-app-env: &app-env
  DEMO_MODE: "${DEMO_MODE:-offline}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  CRAG_DATABASE_URL: postgresql://crag:crag@postgres:5432/crag
  CRAG_REDIS_URL: redis://redis:6379/0
  CRAG_OPENSEARCH_URL: http://opensearch:9200
  CRAG_S3_ENDPOINT_URL: http://minio:9000
  CRAG_S3_ACCESS_KEY: crag-dev-access
  CRAG_S3_SECRET_KEY: crag-dev-secret-key
  CRAG_S3_BUCKET: crag-raw
  CRAG_QDRANT_URL: http://qdrant:6333
  CRAG_OIDC_ISSUER: http://dev-oidc:8612
  CRAG_OIDC_PUBLIC_ISSUER: http://localhost:8612
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crag
      POSTGRES_PASSWORD: crag
      POSTGRES_DB: crag
    ports: ["127.0.0.1:8620:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crag -d crag"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:8630:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: ["qdrant"]
    ports: ["127.0.0.1:8643:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
      # dev stack: the disk allowance can look "full" to OpenSearch on shared hosts (DECISIONS.md)
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports: ["127.0.0.1:8640:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      network: host
      args: *build-args
    image: compliance-rag/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: crag-dev-access
      MINIO_ROOT_PASSWORD: crag-dev-secret-key
    ports: ["127.0.0.1:8641:9000", "127.0.0.1:8642:9001"]
    volumes: [miniodata:/data]

  dev-oidc:
    build:
      context: .
      dockerfile: docker/dev-oidc.Dockerfile
      network: host
      args: *build-args
    image: compliance-rag/dev-oidc:dev
    environment:
      DEV_OIDC_PUBLIC_URL: http://localhost:8612
    ports: ["127.0.0.1:8612:8612"]

  migrate:
    image: compliance-rag/api:dev
    command: ["crag", "migrate"]
    environment: *app-env
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    image: compliance-rag/api:dev
    command: ["crag", "seed", "--no-migrate"]
    environment: *app-env
    restart: "no"
    depends_on:
      migrate: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      network: host
      args: *build-args
    image: compliance-rag/api:dev
    environment: *app-env
    ports: ["127.0.0.1:8610:8610"]
    # GET /v1/evals/latest serves what `make eval` last wrote (the image carries the committed copy)
    volumes: ["./evals/reports:/app/evals/reports:ro"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      dev-oidc: { condition: service_healthy }

  worker:
    image: compliance-rag/api:dev
    command: ["arq", "compliance_rag.worker.main.WorkerSettings"]
    environment: *app-env
    ports: ["127.0.0.1:8611:8611"]
    healthcheck:
      test: ["CMD", "arq", "--check", "compliance_rag.worker.main.WorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      network: host
      args:
        <<: *build-args
        VITE_DEV_PERSONAS: "1"  # local dev stack only: dev-oidc persona switcher
    image: compliance-rag/web:dev
    ports: ["127.0.0.1:8600:8080"]
    depends_on:
      api: { condition: service_healthy }

  # --- profile observability (BUILD.md §14): collector 8680/8681, Grafana 8690, Prometheus 8691, Jaeger 8692
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes: ["./deploy/otel/collector.yaml:/etc/otelcol/collector.yaml:ro"]
    ports: ["127.0.0.1:8680:4317", "127.0.0.1:8681:4318"]
    depends_on: [jaeger]  # distroless images (collector, Jaeger) have no shell for a healthcheck

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: ["observability"]
    ports: ["127.0.0.1:8692:16686"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:8691:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:8690:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  osdata:
  miniodata:
  qdrantdata:
