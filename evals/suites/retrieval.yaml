# Retrieval-only suite: hybrid retrieval + RRF + rerank, no generation.
name: retrieval
description: Recall, MRR and latency of retrieval alone, with the persona's ACL and as_of.
dataset: evals/datasets/questions.v1.jsonl
target: compliance_rag.evals.target:RetrievalTarget
concurrency: 4
metrics:
  - name: recall@10
    fn: compliance_rag.evals.metrics:recall_at_10
    threshold: {min: 0.90}
  - name: mrr@10
    fn: compliance_rag.evals.metrics:mrr_at_10
    threshold: {min: 0.70}
  - name: acl_leakage
    fn: compliance_rag.evals.metrics:acl_leak
    aggregate: max
    threshold: {max: 0}
    hard: true
  - name: retrieval_p95
    fn: compliance_rag.evals.metrics:retrieval_ms
    aggregate: p95
    unit: ms
    threshold: {max: 300}
